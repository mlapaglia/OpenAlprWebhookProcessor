<mat-sidenav-container fullscreen>
  <mat-sidenav
    mode="over" i18n-mode
    [(opened)]="navBarVisible"
    [fixedInViewport]="false"
    [fixedTopGap]="0"
    [fixedBottomGap]="0">
    <mat-nav-list>
      @for (item of navItems; track item) {
        <mat-list-item (click)="handleSideNavClick();" [routerLink]="item.link">
          <mat-icon matListItemIcon>{{item.icon}}</mat-icon>
          <span class="mobile-shrink">{{item.linkTitle}}</span>
        </mat-list-item>
      }
      <app-theme-picker />
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content fullscreen>
    @if (topBarVisible) {
      <nav mat-tab-nav-bar mat-align-tabs="start" i18n-mat-align-tabs
        [tabPanel]="tabPanel">
        <a mat-tab-link routerLink="/" class="home-button">
          <div class="icon-container">
            <div [ngClass]="isSignalrConnected ? 'pulse-circle': 'pulse-circle-offline'"></div>
            <mat-icon i18n [ngClass]="isSignalrConnected ? 'glow' : 'glow-offline'">anchor</mat-icon>
          </div>
          <span i18n style="padding-left:6px;">OpenALPR Webhook Processor</span></a>
          <a mat-tab-link routerLink="/"><mat-icon i18n>home</mat-icon><span i18n>Home</span></a>
          <a mat-tab-link routerLink="/plates"><mat-icon i18n>crop_16_9</mat-icon><span i18n>Plates</span></a>
          <a mat-tab-link (click)="settingsButtonClicked();" (keydown)="settingsButtonClicked()" tabindex="0"><mat-icon i18n>settings</mat-icon><span i18n>Settings</span></a>
          <a mat-tab-link (click)="logout()" (keydown)="settingsButtonClicked()" tabindex="0"><mat-icon i18n>exit_to_app</mat-icon><span i18n>Logout</span></a>
        </nav>
      }
      <app-alert />
      <mat-tab-nav-panel #tabPanel>
        <router-outlet />
      </mat-tab-nav-panel>
    </mat-sidenav-content>
  </mat-sidenav-container>
