<h1 i18n mat-dialog-title>Edit Plate</h1>
<mat-dialog-content>
    <mat-form-field>
        <mat-label i18n>Plate Number</mat-label>
        <input matInput [(ngModel)]="plate.plateNumber" required>
    </mat-form-field>
</mat-dialog-content>
<div mat-dialog-actions align="end" i18n-align>
    <button i18n mat-raised-button [mat-dialog-close]="false">Cancel</button>
    <button i18n mat-raised-button [mat-dialog-close]="true" cdkFocusInitial color="primary">Save</button>
</div>
