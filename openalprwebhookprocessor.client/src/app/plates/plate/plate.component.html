<div class="plate-container">
  <!-- Compact Header -->
  <div class="plate-header">
    <div class="plate-title">
      <h2>{{plate.plateNumber}}</h2>
      <span class="plate-meta">{{plate.receivedOn | date:"medium"}} • {{plate.openAlprCameraId}}</span>
    </div>
    <div class="plate-actions">
      <button mat-icon-button class="tab-btn" [class.active]="activeTab === 'overview'" (click)="setTab('overview')">
        <mat-icon>dashboard</mat-icon>
      </button>
      <button mat-icon-button class="tab-btn" [class.active]="activeTab === 'images'" (click)="setTab('images')">
        <mat-icon>photo_library</mat-icon>
      </button>
      <button mat-icon-button class="tab-btn" [class.active]="activeTab === 'stats'" (click)="setTab('stats')">
        <mat-icon>analytics</mat-icon>
      </button>
      <button mat-icon-button class="tab-btn" [class.active]="activeTab === 'notes'" (click)="setTab('notes')">
        <mat-icon>note</mat-icon>
      </button>
    </div>
  </div>

  <!-- Content Area -->
  <div class="plate-content">
    <!-- Overview Tab - Compact Layout -->
    <div class="tab-content" [class.active]="activeTab === 'overview'">
      <div class="overview-grid">
        <div class="quick-images">
          <div class="image-preview vehicle-preview" (click)="setTab('images')">
            <img [src]="getVehicleImageUrl()" alt="Vehicle" class="preview-img" />
            <div class="preview-overlay">
              <mat-icon>zoom_in</mat-icon>
            </div>
          </div>
          <div class="image-preview plate-preview" (click)="setTab('images')">
            <img [src]="getPlateImageUrl()" alt="Plate" class="preview-img" />
            <div class="preview-overlay">
              <mat-icon>zoom_in</mat-icon>
            </div>
          </div>
        </div>
        
        <div class="quick-stats">
          <div class="stat-item">
            <span class="stat-label">Direction</span>
            <span class="stat-value">
              <mat-icon [style.transform]="'rotate(' + (plate.direction - 90) + 'deg)'">arrow_right_alt</mat-icon>
            </span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Vehicle</span>
            <span class="stat-value">{{plate.vehicleDescription || 'Unknown'}}</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Confidence</span>
            <span class="stat-value">{{plate.processedPlateConfidence}}%</span>
          </div>
        </div>
        
        <div class="quick-notes">
          <div class="notes-preview" (click)="setTab('notes')">
            <mat-icon>note</mat-icon>
            <span class="notes-text">{{plate.notes || 'Add notes...'}}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Images Tab -->
    <div class="tab-content" [class.active]="activeTab === 'images'">
      <app-plate-images 
        [plate]="plate" 
        [isVisible]="isVisible && activeTab === 'images'" />
    </div>

    <!-- Statistics Tab -->
    <div class="tab-content" [class.active]="activeTab === 'stats'">
      <app-plate-statistics 
        [plate]="plate" 
        [isVisible]="isVisible && activeTab === 'stats'" />
    </div>

    <!-- Notes Tab -->
    <div class="tab-content" [class.active]="activeTab === 'notes'">
      <app-plate-notes 
        [plate]="plate"
        (plateChange)="onPlateChange($event)" />
    </div>
  </div>
</div>
