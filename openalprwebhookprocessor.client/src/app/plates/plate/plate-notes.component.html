<div class="notes-container">
  <h3 class="section-title" i18n>Notes</h3>
  
  <div class="notes-content">
    <mat-form-field appearance="outline">
      <mat-label i18n>Add your notes about this plate...</mat-label>
      <textarea 
        matInput 
        [cdkTextareaAutosize]="true"
        [cdkAutosizeMaxRows]="10"
        [cdkAutosizeMinRows]="3"
        [(ngModel)]="plate.notes"
        placeholder="Enter any observations, patterns, or relevant information..."></textarea>
    </mat-form-field>
    
    <div class="notes-actions">
      <button mat-raised-button
        color="primary"
        [disabled]="isSavingNotes"
        (click)="saveNotes()"
        [class.spinner]="isSavingNotes">
        <mat-icon>save</mat-icon>
        <span i18n>Save Notes</span>
      </button>
      <button mat-raised-button 
        color="warn"
        (click)="clearNotes()"
        [disabled]="isSavingNotes">
        <mat-icon>clear</mat-icon>
        <span i18n>Clear</span>
      </button>
    </div>
  </div>
</div>
