@if (client) {
  <mat-card style="margin:16px;">
    <mat-card-header style="justify-content: space-between;">
      <mat-card-title>Pushover</mat-card-title>
      <mat-card-subtitle>https://pushover.net/</mat-card-subtitle>
      <mat-slide-toggle
        style="padding-top: 10px;"
        [(ngModel)]="client.isEnabled"
      (change)="onPushoverToggle($event)"></mat-slide-toggle>
    </mat-card-header>
    @if (client.isEnabled) {
      <mat-card-content [@inOutAnimation]>
        <div style="display: flex; flex-direction: column;">
          <mat-form-field>
            <mat-label>User Key</mat-label>
            <input matInput [(ngModel)]="client.userKey">
            <mat-icon matTooltip="The pushover user key, found on the profile page" style="cursor:default" matSuffix>help_center</mat-icon>
          </mat-form-field>
          <mat-form-field>
            <mat-label>API Token</mat-label>
            <input matInput [(ngModel)]="client.apiToken">
            <mat-icon matTooltip="The pushover api token, found under 'Your Applications' on the profile page" style="cursor:default" matSuffix>help_center</mat-icon>
          </mat-form-field>
          <div>
            <mat-checkbox [(ngModel)]="client.sendPlatePreviewEnabled">Send Plate Preview Image</mat-checkbox>
          </div>
          <div>
            <mat-checkbox [(ngModel)]="client.sendEveryPlateEnabled">Send Alerts for every plate</mat-checkbox>
          </div>
        </div>
      </mat-card-content>
    }
    @if (client.isEnabled) {
      <mat-card-actions align="end" [@inOutAnimation]>
        <button mat-raised-button (click)="testClient();" [disabled]="isTesting">
          @if (isTesting) {
            <span class="spinner-border spinner-border-sm mr-1"></span>
          }
          Test
        </button>
        <button mat-raised-button color="primary" (click)="saveClient();" [disabled]="isSaving" btn-primary>
          @if (isSaving) {
            <span class="spinner-border spinner-border-sm mr-1"></span>
          }
          Save
        </button>
      </mat-card-actions>
    }
  </mat-card>
}
