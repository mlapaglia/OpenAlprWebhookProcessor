<mat-card style="display: flex; margin:16px;">
  <mat-card-header i18n>
    Modify Camera Mask
  </mat-card-header>
  <mat-card-content>
    <div class="canvasHolder">
      <div style="display: flex; flex-direction: column;">
        <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: center;">
          <div>
            <mat-button-toggle-group (change)="handleToggleChange($event)" name="fontStyle" aria-label="Font Style" i18n-aria-label>
              <mat-button-toggle i18n value="snapshot">Snapshot</mat-button-toggle>
              <mat-button-toggle i18n value="plates">Plates</mat-button-toggle>
            </mat-button-toggle-group>
          </div>
          <div style="display: flex;">
            <button i18n mat-button color="warn" style="align-self: center;" (click)="resetCanvas()">Reset</button>
            <button i18n mat-button color="primary" style="align-self: center;" (click)="undoLastPoint()">Undo</button>
            @if (samplePlates.length > 0) {
              <mat-paginator #paginator
                (page)="handlePageEvent($event)"
                [length]="samplePlates.length"
                [pageSize]="1"
                [showFirstLastButtons]="false"
                [pageSizeOptions]="[]"
                [hidePageSize]="true"
                [pageIndex]="paginatorIndex"
                aria-label="Select page" i18n-aria-label />
            }
          </div>
        </div>
        <canvas class="canvas" #canvas width="960" height="540"></canvas>
      </div>
      <div #measureDiv></div>
      <div>
        Mask Sample:
        <canvas class="canvas" #sampleCanvas width="480" height="270" ></canvas>
      </div>
      <div>
        <canvas class="canvas" #savingCanvas width="1920" height="1080"></canvas>
      </div>
    </div>
    <div i18n [hidden]="!isLoadingSnapshot">Loading...</div>
  </mat-card-content>
  <mat-card-actions align="end" i18n-align>
    <button i18n mat-button color="primary" (click)="saveMask()">Save</button>
    <button i18n mat-button color="warn" (click)="cancelMask()">Cancel</button>
  </mat-card-actions>
</mat-card>
