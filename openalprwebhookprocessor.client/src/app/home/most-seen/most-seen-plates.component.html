<mat-card class="most-seen-card">
  <mat-card-header>
    <mat-card-title i18n>Most Frequently Seen</mat-card-title>
    <mat-card-subtitle i18n>Top plates by occurrence</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <mat-list>
      @for (plate of mostSeenCounts(); track plate.name; let i = $index) {
        <mat-list-item>
          <div matListItemTitle>
            <span class="rank">#{{ i + 1 }}</span> {{ plate.name }}
          </div>
          <mat-chip i18n matListItemMeta class="count-chip">{{ plate.value }} times</mat-chip>
        </mat-list-item>
      }
    </mat-list>
  </mat-card-content>
</mat-card>
