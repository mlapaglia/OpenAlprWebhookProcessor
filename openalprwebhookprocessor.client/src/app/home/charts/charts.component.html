<div class="charts-row">
  <mat-card class="chart-card">
    <mat-card-header>
      <mat-card-title i18n>Daily Activity</mat-card-title>
      <mat-card-subtitle i18n>Plates detected per day</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="chart-container">
        <canvas #dailyChart></canvas>
        @if (isLoadingCharts()) {
          <mat-spinner class="chart-spinner" />
        }
      </div>
    </mat-card-content>
  </mat-card>
  <mat-card class="chart-card">
    <mat-card-header>
      <mat-card-title i18n>Hourly Distribution</mat-card-title>
      <mat-card-subtitle i18n>Peak detection times</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="chart-container">
        <canvas #hourlyChart></canvas>
        @if (isLoadingCharts()) {
          <mat-spinner class="chart-spinner" />
        }
      </div>
    </mat-card-content>
  </mat-card>
</div>
