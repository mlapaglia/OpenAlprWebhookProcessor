<div class="dashboard-container">
  <!-- Quick Stats Section -->
  <section class="stats-section">
    <app-quick-stats 
      [quickStats]="quickStats"
      [isLoadingStats]="isLoadingStats"
      [quickStatCols]="quickStatCols" />
  </section>

  <!-- Charts Section -->
  <section class="charts-section">
    <app-charts [isLoadingCharts]="isLoadingCharts" />
  </section>

  <!-- Predictions and Most Seen Section -->
  <section class="predictions-and-insights-section">
    <app-predictions-section 
      [nextExpected]="nextExpected"
      [upcomingPredictions]="upcomingPredictions"
      [predictablePlates]="predictablePlates"
      [isLoadingPredictions]="isLoadingPredictions" />
    <app-most-seen-plates [mostSeenCounts]="mostSeenCounts" />
  </section>
</div>

<style>
  .dashboard-container {
    padding: 1.5rem;
    max-width: 100%;
    width: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    overflow-x: hidden;
  }

  .charts-section {
    margin-bottom: 1rem;
  }

  .predictions-and-insights-section {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1.5rem;
    margin-bottom: 1rem;
    align-items: start;
  }

  /* Responsive layout improvements */
  @media (max-width: 768px) {
    .dashboard-container {
      padding: 1rem;
      gap: 1.5rem;
    }
  }

  @media (max-width: 480px) {
    .dashboard-container {
      padding: 0.75rem;
      gap: 1rem;
    }

    .stats-section,
    .charts-section,
    .predictions-and-insights-section {
      margin-bottom: 0.5rem;
    }
    
    .predictions-and-insights-section {
      grid-template-columns: 1fr;
    }
  }
</style>
